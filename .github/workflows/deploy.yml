on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Extract metadata (Finished this block for you)
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Replace 'your-dockerhub-repo' with your actual repository name
          images: ${{ secrets.DOCKERHUB_USERNAME }}/your-dockerhub-repo
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 4. Build and Push (The final step that uses the metadata)
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enables GitHub Actions caching to make subsequent builds faster
          cache-from: type=gha
          cache-to: type=gha,mode=max
