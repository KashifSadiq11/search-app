name: Rec Engine CI/CD

on:
  push:
    branches:
      - master
      - fix/grafana-dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Log in to Docker Hub (using env syntax)
      # =========================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # =========================
      # Build & push Docker image
      # =========================
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME  }}/rec-engine-api:latest

      # =========================
      # Optional: Run container on runner for test
      # =========================
      - name: Test run container (optional)
        run: |
          docker run --rm --env CURRENT_ENVIRONMENT=production \
            ${{ secrets.DOCKER_HUB_USERNAME  }}/rec-engine-api:latest
