name: Rec Engine CI/CD

on:
  push:
    branches:
      - master
      - fix/grafana-dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
            context: .
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

      # =========================
      # Build & push Docker image
      # =========================
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME  }}/rec-engine-api:latest

      # =========================
      # Optional: Run container on runner for test
      # =========================
      - name: Test run container (optional)
        run: |
          docker run --rm --env CURRENT_ENVIRONMENT=production \
            ${{ secrets.DOCKER_HUB_USERNAME  }}/rec-engine-api:latest
