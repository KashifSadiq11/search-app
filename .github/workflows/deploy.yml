name: Docker CI/CD

on:
  push:
    branches: [ "main" ] # Runs whenever you push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Buildx (The "Industrial Oven" for fast builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Login to Docker Hub using GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Extract metadata (Tags your image with 'latest' AND the git commit SHA)
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/your-repo-name
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 4. Build and Push with Caching
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          # This saves your layers in GitHub's cache to speed up the next run
          cache-from: type=gha
          cache-to: type=gha,mode=max
