name: Rec Engine CI/CD

on:
  push:
    branches:
      - master
      - fix/grafana-dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Debug: Verify secrets are available
      # =========================
      - name: Debug Docker secrets
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}"
          echo "DOCKER_PASSWORD length=${{ secrets.DOCKER_PASSWORD }}" # just length, not actual password

      # =========================
      # Docker login
      # =========================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # Build & push Docker image
      # =========================
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rec-engine-api:latest

      # =========================
      # Optional: Run container on runner for test
      # =========================
      - name: Test run container (optional)
        run: |
          docker run --rm --env CURRENT_ENVIRONMENT=development \
            ${{ secrets.DOCKER_USERNAME }}/rec-engine-api:latest
