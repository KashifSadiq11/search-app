name: Rec Engine CI/CD

on:
  push:
    branches:
      - fix/grafana-dashboard
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # =========================
      # Checkout code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Debug: Check if secrets exist
      # =========================
      - name: Verify secrets are available
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "ERROR: DOCKER_USERNAME is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "ERROR: DOCKER_PASSWORD is not set"
            exit 1
          fi
          echo "Secrets are available"
          echo "Username length: ${#DOCKER_USERNAME}"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      # =========================
      # Setup Docker Buildx
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Docker login - Method 1
      # =========================
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # =========================
      # Build + Push API Image
      # =========================
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rec-engine-api:latest
            ${{ secrets.DOCKER_USERNAME }}/rec-engine-api:${{ github.sha }}

      # =========================
      # SSH Deploy to EC2
      # =========================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/rec-engine
            git pull origin master
            docker compose pull
            docker compose up -d --build
            docker image prune -f
