name: Rec Engine CI/CD

on:
  push:
    branches:
      - fix/grafana-dashboard
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # =========================
      # Checkout code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Setup Docker Buildx
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Docker login using environment variables
      # =========================
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      # =========================
      # Build + Push API Image
      # =========================
      - name: Build and push API image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build -t ${DOCKER_USERNAME}/rec-engine-api:latest -t ${DOCKER_USERNAME}/rec-engine-api:${{ github.sha }} .
          docker push ${DOCKER_USERNAME}/rec-engine-api:latest
          docker push ${DOCKER_USERNAME}/rec-engine-api:${{ github.sha }}

      # =========================
      # SSH Deploy to EC2
      # =========================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/rec-engine
            git pull origin master
            docker compose pull
            docker compose up -d --build
            docker image prune -f
