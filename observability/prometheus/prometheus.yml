# Prometheus Configuration for Recommendation Engine
# https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s          # Default scrape interval
  evaluation_interval: 15s      # Rule evaluation interval
  scrape_timeout: 10s

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load alert rules
# rule_files:
#   - /etc/prometheus/alerts/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Recommendation Engine API
  # Adjust the target based on your setup:
  # - Docker: Use container name or service name
  # - Local: Use localhost with the app port
  - job_name: 'rec-engine'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      # For Docker network (when both stacks are on same network)
      # - targets: ['rec_engine_api:8000']

      # For local development (app running on host)
      - targets: ['host.docker.internal:8016']

    # Relabel to add instance labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rec-engine-api'

  # Redis metrics (if redis_exporter is added)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL metrics (if postgres_exporter is added)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
