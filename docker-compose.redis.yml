version: "3.9"

services:
  redis:
    image: redis:7.4
    container_name: rec_engine_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: rec_engine_redisinsight
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  redisinsight_data:
