
services:
  # =========================
  # Application API
  # =========================
  api:
    build: .
    container_name: rec_engine_api
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8016:8000"
    volumes:
      - ./services/engine/ml_models:/app/services/engine/ml_models
      - ./services/engine:/app/services/engine:ro
      - ./ui:/app/ui:ro
    restart: unless-stopped
    networks:
      - rec_engine_net

  # =========================
  # PostgreSQL
  # =========================
  db:
    image: postgres:16
    container_name: rec_engine_db_postgres
    env_file:
      - .env
    ports:
      - "5440:5432"
    command: ["postgres", "-c", "port=5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - rec_engine_net

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7.4
    container_name: rec_engine_cache_redis
    ports:
      - "6384:6379"
    command: ["redis-server", "--port", "6379", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - rec_engine_net

  # =========================
  # Redis Exporter (for Prometheus)
  # =========================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: rec_engine_redis_exporter
    environment:
      REDIS_ADDR: "rec_engine_cache_redis:6379"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - rec_engine_net

  # =========================
  # PostgreSQL Exporter (for Prometheus)
  # =========================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: rec_engine_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:12345678@rec_engine_db_postgres:5432/rec_engine?sslmode=disable"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - rec_engine_net

  # =========================
  # Prometheus
  # =========================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: rec_engine_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - rec_engine_net

  # =========================
  # Grafana
  # =========================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: rec_engine_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - rec_engine_net

# =========================
# Network
# =========================
networks:
  rec_engine_net:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  pg_data:
  redis_data:
  prometheus_data:
  grafana_data:
